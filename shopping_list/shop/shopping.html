<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Shopping List</title>
    <style>
        /* --- CSS STYLING --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .list-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #2ecc71;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: #f9f9f9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #2ecc71;
            animation: fadeIn 0.3s ease;
        }

        .delete-btn {
            background-color: #e74c3c;
            padding: 6px 12px;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- --- HTML STRUCTURE --- -->
    <div class="list-container">
        <h2>Shopping List</h2>
        
        <div class="input-area">
            <input type="text" id="itemInput" placeholder="Add an item... (e.g., Milk)">
            <button id="addBtn">Add</button>
        </div>

        <ul id="shoppingList"></ul>
    </div>

    <!-- --- JAVASCRIPT LOGIC --- -->
    <script>
        // 1. DOM Elements
        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const shoppingList = document.getElementById('shoppingList');

        // 2. Load existing items from LocalStorage on page load
        document.addEventListener('DOMContentLoaded', loadItems);

        // 3. Event Listeners
        addBtn.addEventListener('click', addItem);
        itemInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addItem();
        });

        // 4. Functions
        function addItem() {
            const itemText = itemInput.value.trim();
            
            if (itemText === '') {
                alert('Please enter an item!');
                return;
            }

            // Create list element
            createListElement(itemText);

            // Save to LocalStorage
            saveItemToStorage(itemText);

            // Clear input field
            itemInput.value = '';
        }

        function createListElement(text) {
            const li = document.createElement('li');
            li.textContent = text;

            // Create delete button
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'X';
            deleteBtn.classList.add('delete-btn');
            
            // Delete event
            deleteBtn.addEventListener('click', function() {
                li.remove();
                removeItemFromStorage(text);
            });

            li.appendChild(deleteBtn);
            shoppingList.appendChild(li);
        }

        // --- LOCAL STORAGE FUNCTIONS ---
        function getItemsFromStorage() {
            let items;
            if (localStorage.getItem('shoppingItems') === null) {
                items = [];
            } else {
                items = JSON.parse(localStorage.getItem('shoppingItems'));
            }
            return items;
        }

        function saveItemToStorage(item) {
            let items = getItemsFromStorage();
            items.push(item);
            localStorage.setItem('shoppingItems', JSON.stringify(items));
        }

        function loadItems() {
            let items = getItemsFromStorage();
            items.forEach(function(item) {
                createListElement(item);
            });
        }

        function removeItemFromStorage(itemText) {
            let items = getItemsFromStorage();
            items = items.filter(item => item !== itemText);
            localStorage.setItem('shoppingItems', JSON.stringify(items));
        }
    </script>
</body>
</html>
